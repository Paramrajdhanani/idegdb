<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Glacier Ice & Titanium Metallic Gradient -->
    <linearGradient id="glacier-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <!-- Deep Titanium Core Background -->
    <linearGradient id="titanium-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Crystal Ice Chisel Gradient -->
    <linearGradient id="ice-crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Titanium Silver Glow -->
    <linearGradient id="titanium-silver" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Frost Ambient Glow Filter -->
    <filter id="frost-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Isometric Frost Shield / Diamond Hexagon -->
  <path d="M24 4L42 14.5V33.5L24 44L6 33.5V14.5L24 4Z" fill="url(#glacier-bg)" filter="url(#frost-glow)" />
  <path d="M24 5.5L40.5 15.2V32.8L24 42.5L7.5 32.8V15.2L24 5.5Z" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.2" />

  <!-- Inner Deep Titanium Facet -->
  <path d="M24 9L38 17.5V30.5L24 39L10 30.5V17.5L24 9Z" fill="url(#titanium-core)" />

  <!-- Left Code Bracket < (Glacier Crystal Ice) -->
  <path d="M19 18L13 24L19 30" stroke="url(#ice-crystal)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Code Bracket > (Glacier Crystal Ice) -->
  <path d="M29 18L35 24L29 30" stroke="url(#ice-crystal)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Titanium Frost Chisel / Forge Needle -->
  <path d="M26 15L22 25H27L22 33" stroke="url(#titanium-silver)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Core Prism Diamond Light -->
  <circle cx="24" cy="24" r="1.6" fill="#ffffff" />
</svg>
