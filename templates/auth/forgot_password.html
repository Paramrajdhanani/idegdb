{% extends 'base.html' %}

{% block title %}Reset Password | CodeForge IDE{% endblock %}

{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%, rgba(108, 99, 255, 0.12), transparent 70%);padding:20px;">
  <div style="width:100%;max-width:400px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-xl);padding:32px;box-shadow:var(--shadow-lg);">
    <div style="text-align:center;margin-bottom:24px;">
      <h2 style="font-size:20px;font-weight:700;margin-bottom:6px;">Reset Password</h2>
      <p style="color:var(--text-muted);font-size:13px;">Enter your registered email address to receive recovery instructions.</p>
    </div>

    <form onsubmit="event.preventDefault(); Toast.success('Reset link dispatched to your email.'); setTimeout(() => window.location.href='/login/', 1500);">
      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px;">Email Address</label>
        <input type="email" class="input-control" placeholder="developer@example.com" required />
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;padding:10px;font-size:14px;margin-bottom:16px;">
        Send Recovery Email
      </button>

      <div style="text-align:center;font-size:13px;color:var(--text-muted);">
        Remember your password? <a href="/login/" style="color:var(--accent-primary);text-decoration:none;">Sign In</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
